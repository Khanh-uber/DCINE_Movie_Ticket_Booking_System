version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: dcine-mysql
    command: --lower_case_table_names=1
    environment:
      MYSQL_ROOT_PASSWORD: "KimHuong14112005@"
      MYSQL_DATABASE: "dcine_schema"
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL","mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -p\"${MYSQL_ROOT_PASSWORD}\"" ]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7
    container_name: dcine-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server","--save","60","1"]
    healthcheck:
      test: ["CMD-SHELL","redis-cli ping | grep -i PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  db_data:
  redis_data:
