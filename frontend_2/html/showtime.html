<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8"/>
  <title>D-cine — Chọn lịch chiếu</title>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <!-- Core CSS (giữ nguyên đường dẫn dự án) -->
  <link rel="stylesheet" href="../assets/css/variable.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/header.css">
  <link rel="stylesheet" href="../assets/css/footer.css">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/components.css">

  <!-- Page CSS -->
  <link rel="stylesheet" href="../assets/css/showtime.css">
</head>
<body class="theme-dcine">
  <!-- Header include -->
  <div id="hdr-include"></div>

  <main class="container showtime-page">
    <nav id="bc" class="breadcrumb" aria-label="Breadcrumb"></nav>

    <div class="st-grid">
      <!-- LEFT: Movie card -->
      <aside id="movieSide" class="movie-side">
        <div class="poster-wrap">
          <img id="mvPoster" alt="Poster" />
          <!-- Trailer: đỏ + căn giữa -->
          <button id="btnTrailer" class="btn trailer-red" hidden>
            ▶ WATCH TRAILER
          </button>
        </div>

        <div class="mv-copy">
          <h1 id="mvTitle">—</h1>
          <div class="mv-meta">
            <span id="mvYear">—</span> <span class="dot">•</span>
            <span id="mvGenres">—</span> <span class="dot">•</span>
            <span id="mvDuration">—</span>
          </div>
          <p id="mvDesc" class="mv-desc">—</p>

          <div class="cta-vertical">
            <a id="btnContinue" class="btn" href="#filters">CONTINUE BOOKING</a>
            <a id="btnBack" class="btn outline" href="movies.html">⬅ BACK TO MOVIE PAGE</a>
          </div>
        </div>
      </aside>

      <!-- RIGHT: Filters + Theatres + Showtimes -->
      <section class="picker">
        <!-- Filters -->
        <div id="filters" class="filters card">
          <div class="field">
            <label for="citySel">Select your city</label>
            <select id="citySel"></select>
          </div>
          <div class="field">
            <label for="dateSel">Date</label>
            <input id="dateSel" type="date" />
          </div>
        </div>

        <!-- Day chips -->
        <div id="dayChips" class="day-chips"></div>

        <!-- Theatres (2 cột) -->
        <div class="theater-group">
          <div class="tg-head">
            <h3 id="cityLabel" class="section-ttl">Movie Theatres in —</h3>
          </div>
          <div id="theaterChips" class="chips grid-2"></div>
        </div>

        <!-- Showtimes -->
        <div id="showtimesWrap" class="showtimes card" aria-live="polite"></div>
      </section>
    </div>
  </main>

  <!-- Footer include -->
  <div id="footer-include"></div>

  <script>window.API_BASE = window.API_BASE || '/api';</script>
  <script src="../assets/js/main.js" defer></script>
  <script src="../assets/js/showtime.js" defer></script>
</body>
</html>
