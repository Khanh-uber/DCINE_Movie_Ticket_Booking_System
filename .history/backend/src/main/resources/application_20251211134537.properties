groq.api.key=import json
import os
from dotenv import load_dotenv
from sentence_transformers import SentenceTransformer
from langchain_community.vectorstores import FAISS
from langchain_huggingface import HuggingFaceEmbeddings
from langchain_text_splitters import RecursiveCharacterTextSplitter
from langchain_core.documents import Document
from langchain_google_genai import ChatGoogleGenerativeAI
from langchain_core.prompts import PromptTemplate

load_dotenv()
# === 1. Đoc dữ liệu từ file JSON ===
with open("data/movie.json", "r", encoding="utf-8") as f :
    movies = json.load(f)
docs = []
for m in movies:
    text = f"Phim: {m['title']}. Thời lượng: {m['duration_min']} phút. " \
           f"Đánh giá: {m['rating']}. Ngày khởi chiếu: {m['release_date']}. " \
           f"Tóm tắt nội dung: {m['synopsis']}."
    docs.append(Document(page_content=text, metadata = {"source": "movie"}))


# === Cat nho van ban neu can ====
splitter = RecursiveCharacterTextSplitter(chunk_size=1000, chunk_overlap=100) #Tao ra 1 doi tuong 
split_docs = splitter.split_documents(docs) #chia thanh cac chunk 


# === Tao embedding bang SentenceTransformer ===
embedding_model = HuggingFaceEmbeddings(model_name="paraphrase-multilingual-MiniLM-L12-v2") 



# === Tao faiss index truc tiep ===
vector_db = FAISS.from_documents(split_docs, embedding_model)
vector_db.save_local("embeddings/movies_index") 


# === Tao retriever
retriever = vector_db.as_retriever(search_type="similarity", search_kwargs={"k":3})

# === 3. Khởi tạo mô hình Gemini Flash ===
llm = ChatGoogleGenerativeAI(model="gemini-2.0-flash", temperature=0.3)

promp_template = """
Bạn là chatbot hỗ trợ khách hàng của rạp phim D-Cine.
Dưới đây là thông tin nội bộ hệ thống:

{context}

Câu hỏi của khách hàng: {question}

Hãy trả lời ngắn gọn, thân thiện, bằng tiếng Việt.
Chỉ trả lời từ dữ liệu được cung cấp.
Nếu không đủ thông tin, hãy nói: "Hiện tôi chưa có thông tin này trong hệ thống.
"""

prompt = PromptTemplate(template = promp_template , 
                        input_variables = ["context", "question"])

question = "Tất cả các phim nào chiếu sau ngày 1 tháng 5 2025"

relevant_docs = retriever.invoke(question)

context_text = "\n\n".join(doc.page_content for doc in relevant_docs)

final_promp = prompt.invoke({"context":context_text,"question":question})

# GOi LLM
answer = llm.invoke(final_promp)

print("\n🤖 Chatbot:")
print(answer.content)






